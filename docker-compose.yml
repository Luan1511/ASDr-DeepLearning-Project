# Self-contained stack: PostgreSQL + backend + frontend (+ optional ML server).
# Secrets come from ./.env (copy .env.example). See DOCKER_DEPLOY.md.
#
#   docker compose up -d --build              # db + backend + frontend
#   docker compose --profile ml up -d --build # also the ML server (needs GPU + OpenPose build)

services:
  db:
    image: postgres:16-alpine
    container_name: asdr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asdr}
      # Prisma stores UTC; keep the server zone UTC as well.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only; remove the IP to expose it on the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - asdr_db_data:/var/lib/postgresql/data
    networks:
      - asdr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asdr-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asdr}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 16 chars) in .env}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      MAX_UPLOAD_MB: 200
      # ML server: the GPU host by default; use http://ml-api:8000 with --profile ml.
      OPENPOSE_SERVER_URL: ${OPENPOSE_SERVER_URL:-http://host.docker.internal:8000}
      OPENPOSE_API_KEY: ${ML_API_KEY:-}
      EXTRACT_API_TIMEOUT_MS: 3600000
      ML_MAX_CONCURRENCY: 1
      BYPASS_EXTRACT_API: ${BYPASS_EXTRACT_API:-false}
      RETAIN_UPLOADED_VIDEOS: "false"
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too.
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - asdr-network
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: asdr-frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - asdr-network

  # Optional. The image does NOT contain OpenPose: mount a Linux OpenPose build
  # compatible with the container (OPENPOSE_HOST_DIR) and put the checkpoint
  # (+ calibration.json) in API/ASD_Model. Running the ML server directly on the
  # GPU host (current setup) is the recommended path.
  ml-api:
    profiles: ["ml"]
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: asdr-ml-api
    environment:
      ML_API_KEY: ${ML_API_KEY:-}
      VIDEO_RETENTION: blurred
      ML_MAX_CONCURRENT_JOBS: 1
      OPENPOSE_BIN: /opt/openpose/build/examples/openpose/openpose.bin
      OPENPOSE_MODEL_DIR: /opt/openpose/models
      OPENPOSE_TIMEOUT_SECONDS: 3600
    ports:
      - "8000:8000"
    networks:
      - asdr-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./API/storage:/app/storage
      - ./API/ASD_Model:/app/ASD_Model:ro
      - ${OPENPOSE_HOST_DIR:-/workspace/openpose}:/opt/openpose:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  asdr_db_data:

networks:
  asdr-network:
    driver: bridge
